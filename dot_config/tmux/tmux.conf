# List of plugins.
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'catppuccin/tmux#v2.3.0'
set -g @plugin 'tmux-plugins/tmux-yank'

# Options to make tmux more pleasant.
set -g mouse on
set -g default-terminal "tmux-256color"
set -as terminal-features ",alacritty:RGB"

# Load catppuccin
run '~/.config/tmux/plugins/tmux/catppuccin.tmux'

# Configure the catppuccin plugin.
set -g @catppuccin_flavor "mocha"
set -g @catppuccin_window_status_style "rounded"

# Force the tmux counting to start at 1 (easier to navigate).
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

set-option -g status-position top

# Avoid the terminal application to rename windows inside tmux.
set-option -g allow-rename off
set-window-option -g automatic-rename off
# Force the same on the Catppuccin theme.
set -g @catppuccin_window_default_text "#W"
set -g @catppuccin_window_text "#W"
set -g @catppuccin_window_current_text "#W"

# Make the status line pretty and add some modules.
set -g status-right-length 100
set -g status-left-length 100
set -g status-left ""
set -g status-right "#{E:@catppuccin_status_application}"
set -agF status-right "#{E:@catppuccin_status_cpu}"
set -agF status-right "#{E:@catppuccin_status_ram}"
set -ag status-right "#{E:@catppuccin_status_session}"
# set -ag status-right "#{E:@catppuccin_status_uptime}"
set -agF status-right "#{E:@catppuccin_status_battery}"

# Passthrough option to enable nnn preview-tui.
set -g allow-passthrough on

run '~/.tmux/plugins/tpm/tpm'
